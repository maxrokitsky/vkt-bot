name: Lint and Format

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Раньше здесь стоял `pip install ruff` без версии: линтер обновлялся
      # сам, включал новые правила по умолчанию и ронял CI на неизменном коде.
      # Теперь версия берётся из dev-зависимостей проекта.
      - name: Install Ruff
        run: uv sync --only-group dev

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run ruff format (check only)
        run: uv run --no-sync ruff format --check .
